# Simple production on one machine (shop server or a small VPS). See docs/DEPLOYMENT.md.
#   cp .env.example .env   # then set real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
name: construction-erp-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: { context: ./backend, target: prod }
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
      LOG_JSON: "true"
      ENABLE_API_DOCS: "false"
      STORAGE_DIR: /data/files
      BACKUP_DIR: /backups
    volumes:
      - files:/data/files
      # Read-write since Milestone 25: the Backups page writes platform and company backups here.
      # The folder must be writable by uid 10001: `mkdir -p backups && sudo chown 10001 backups`.
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ./frontend, target: prod }
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [backend]

  backup:
    # The backend image (Milestone 25): it has pg_dump and the app, so the loop can read the
    # schedule an admin sets and record every run in the same list as the manual ones.
    build: { context: ./backend, target: prod }
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
      STORAGE_DIR: /files
      BACKUP_DIR: /backups
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-erp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-erp}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - files:/files:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  files:
