# Local development: `make up` then open http://localhost:5173
# API docs: http://localhost:8000/api/docs
name: construction-erp

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: { context: ./backend, target: dev }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/erp
      TEST_DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/erp_test
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_PROXY: http://backend:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]

volumes:
  pgdata:
