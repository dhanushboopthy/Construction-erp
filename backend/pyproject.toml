[project]
name = "construction-erp-backend"
version = "0.1.0"
description = "API for the construction materials ERP (purchase, stock, GST billing, credit)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "httpx>=0.28",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # naming
    "S",             # bandit (security)
    "SIM",           # simplify
    "C4",            # comprehensions
    "DTZ",           # timezone-aware datetimes only
    "T20",           # no print()
    "PT",            # pytest style
    "RUF",           # ruff-specific
]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # SQLAlchemy/Pydantic class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018", "N817", "E501"]
# The sales `world` fixture is imported into the later milestone test files.
"tests/integration/test_{returns,transport,compliance}.py" = ["F811", "E731"]
"app/scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
